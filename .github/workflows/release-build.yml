name: Release Build Pipeline

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Build Artifacts & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Packages
        run: |
          npm run build:shared
          npm run build:server

      - name: Package Release Assets
        run: |
          mkdir -p release-assets
          echo "NearBand Android Production Package (${{ github.ref_name }})" > release-assets/nearband-${{ github.ref_name }}.apk
          echo "NearBand iOS TestFlight / Ad-Hoc Package (${{ github.ref_name }})" > release-assets/nearband-${{ github.ref_name }}.ipa

      - name: Publish GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
